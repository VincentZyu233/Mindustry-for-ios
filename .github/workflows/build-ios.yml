name: Build iOS IPA

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Mindustry version tag (e.g. v157.4)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # Stage 1: Check commit message & extract version (no checkout needed)
  check-commit:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check commit message
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            if echo "$COMMIT_MSG" | grep -qiE "(build action|build release)"; then
              echo "should_build=true" >> $GITHUB_OUTPUT
            else
              echo "should_build=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Extract version
        id: version
        if: steps.check.outputs.should_build == 'true'
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            VER="${{ inputs.version }}"
          else
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            VER=$(echo "$COMMIT_MSG" | grep -oP '(?<=--version\s)v?\S+' | head -1 || true)
            if [[ -z "$VER" ]]; then
              # Get latest tag from upstream via API (no clone needed)
              VER=$(curl -sL "https://api.github.com/repos/Anuken/Mindustry/tags?per_page=1" \
                | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['name'])" 2>/dev/null || echo "v157.4")
            fi
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT

  # Stage 2: Build iOS IPA (shallow clone, tag only)
  build:
    needs: check-commit
    if: needs.check-commit.outputs.should_build == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout source (shallow, tag only)
        run: |
          git init
          git remote add origin https://github.com/VincentZyu233/Mindustry-for-ios.git
          git fetch --depth=1 origin tag ${{ needs.check-commit.outputs.version }}
          git checkout FETCH_HEAD

      - name: Clone Arc engine
        run: |
          git clone --depth=1 --branch=master https://github.com/Anuken/Arc.git ../Arc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/gradle-wrapper.properties') }}

      - name: Prepare native libraries and fix framework paths
        run: |
          mkdir -p ios/libs
          cp ../Arc/natives/natives-freetype-ios/libs/libarc-freetype.a ios/libs/
          mkdir -p ../Arc/natives/natives-ios/libs

          FW_SRC="$HOME/.m2/repository/com/mobidevelop/robovm/robovm-dist/2.3.24/unpacked/robovm-2.3.24/lib/vm/ios/arm64/MetalANGLEKit.framework"
          if [ -d "$FW_SRC" ]; then
            cp -R "$FW_SRC" ios/libs/
          else
            find "$HOME/.m2" -name "MetalANGLEKit*" -maxdepth 10 2>/dev/null | head -5
          fi

          printf '\n// CI workaround: MetalANGLEKit framework path\nafterEvaluate {\n    tasks.withType(org.robovm.gradle.tasks.AbstractRoboVMBuildTask) { task ->\n        def d = file("libs")\n        if (d.exists()) task.robovmConfig.frameworkPaths.add(d)\n    }\n}\n' >> ios/build.gradle

      - name: Build IPA
        run: |
          VER="${{ needs.check-commit.outputs.version }}"
          VER="${VER#v}"
          # noLocalArc: avoid local Arc composite build issues with MetalANGLEKit
          ./gradlew -PnoLocalArc ios:incrementConfig ios:deploy \
            -Pbuildversion=$VER \
            -Probovm.iosSkipSigning=true \
            --no-daemon

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-${{ needs.check-commit.outputs.version }}
          path: ios/build/robovm/*.ipa
          compression-level: 0

  # Stage 3: Create GitHub Release
  publish:
    needs: [check-commit, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: Mindustry-iOS-${{ needs.check-commit.outputs.version }}
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-commit.outputs.version }}
          name: Mindustry iOS ${{ needs.check-commit.outputs.version }}
          body: |
            ## Mindustry iOS Build

            **Version:** `${{ needs.check-commit.outputs.version }}`

            ### Downloads

            | Platform | File |
            |----------|------|
            | iOS IPA | `Mindustry-iOS-${{ needs.check-commit.outputs.version }}.ipa` |

            ### ⚠️ Note
            This IPA is unsigned. Use AltStore, Sideloadly, or similar tools to sideload.
          files: release/*.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
