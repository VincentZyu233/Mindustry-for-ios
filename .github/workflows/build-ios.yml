name: Build iOS IPA

on:
  push:
    branches:
      - master
      - main
      - ios-v157.4
  workflow_dispatch:
    inputs:
      version:
        description: 'Mindustry version tag (e.g. v157.4)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  check-commit:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check commit message
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            if echo "$COMMIT_MSG" | grep -qiE "(build action|build release|build ios|ipa)"; then
              echo "should_build=true" >> $GITHUB_OUTPUT
            else
              echo "should_build=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Extract version
        id: version
        if: steps.check.outputs.should_build == 'true'
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            VER="${{ inputs.version }}"
          else
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            VER=$(echo "$COMMIT_MSG" | grep -oP '(?<=--version\s)v?\S+' | head -1 || true)
            if [[ -z "$VER" ]]; then
              VER="v157.4"
            fi
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT

  build:
    needs: check-commit
    if: needs.check-commit.outputs.should_build == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout source
        run: |
          git init
          git remote add origin https://github.com/VincentZyu233/Mindustry-for-ios.git
          git fetch --depth=1 origin ${{ github.sha }}
          git checkout FETCH_HEAD

      - name: Clone Arc engine
        run: |
          ARC_HASH=$(grep '^archash=' gradle.properties | cut -d= -f2)
          git clone --recursive https://github.com/Anuken/Arc.git ../Arc
          cd ../Arc
          git checkout "$ARC_HASH"
          git submodule update --init --recursive
          git lfs install
          git lfs pull

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/gradle-wrapper.properties') }}

      - name: Prepare native libraries
        run: |
          mkdir -p ios/libs
          cp ../Arc/natives/natives-freetype-ios/libs/libarc-freetype.a ios/libs/

          curl -L \
            -o /tmp/MetalANGLEKit.zip \
            https://github.com/libgdx/MetalANGLEKit/releases/download/v1.2.1/metalanglekit.zip
          echo "c7785cbe15eb9e5962677513725c8f0e33039f344235cc7691ee5ac35ff5ea91  /tmp/MetalANGLEKit.zip" | shasum -a 256 -c
          unzip -q /tmp/MetalANGLEKit.zip -d ios/libs
          find ios/libs -maxdepth 2 \( -name "*.framework" -o -name "*.xcframework" \) | sort

      - name: Build IPA
        run: |
          VER="${{ needs.check-commit.outputs.version }}"
          VER="${VER#v}"
          ./gradlew ios:incrementConfig ios:deploy \
            -Pbuildversion=$VER \
            -Probovm.iosSkipSigning=true \
            --no-daemon

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-${{ needs.check-commit.outputs.version }}
          path: ios/build/robovm/*.ipa
          compression-level: 0

  publish:
    needs: [check-commit, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: Mindustry-iOS-${{ needs.check-commit.outputs.version }}
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-commit.outputs.version }}
          name: Mindustry iOS ${{ needs.check-commit.outputs.version }}
          body: |
            ## Mindustry iOS Build

            **Version:** `${{ needs.check-commit.outputs.version }}`

            This IPA is built from the `ios-v157.4` branch based on upstream `v157.4`.
            It is unsigned and should be sideloaded with AltStore, Sideloadly, or a similar tool.
          files: release/*.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
